# Builds the installable apps and publishes them on the GitHub Releases page,
# under the version in src-tauri/tauri.conf.json (for example v1.0.0).
# Runs when code is pushed to the "release" branch.
name: Build apps

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            args: ""
          - name: macOS (Apple chips and Intel)
            runner: macos-latest
            args: "--target universal-apple-darwin"
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.runner == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Plain PDF v__VERSION__
          releaseCommitish: ${{ github.sha }}
          releaseBody: |
            Download the file for your device:
            - **Windows:** the `.exe` file (installer)
            - **Mac:** the `.dmg` file
            - **Android:** the `.apk` file
            These apps aren't from an app store, so your device asks you to confirm the first time. See the README for step-by-step instructions.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Install the Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Create the Android project
        run: |
          npx tauri android init --ci
          node scripts/android-setup.mjs
      - name: Build the app (for 64-bit phones, like the Pixel)
        run: npx tauri android build --apk --target aarch64
      - name: Sign the app
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Signing with the saved key (ANDROID_KEYSTORE_BASE64)."
            echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
            PASSWORD="$KEYSTORE_PASSWORD"
          else
            echo "No saved key found: signing with a one-off key."
            # No saved key yet: sign with a one-off key. (Updates then need
            # the old app removed first; saving a key as a secret avoids that.)
            PASSWORD=$(openssl rand -hex 16)
            keytool -genkeypair -keystore release.jks -alias plainpdf -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "$PASSWORD" -keypass "$PASSWORD" -dname "CN=Plain PDF" > /dev/null
          fi
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" | head -1)
          TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$TOOLS/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "$TOOLS/apksigner" sign --ks release.jks --ks-pass "pass:$PASSWORD" --ks-key-alias plainpdf \
            --out "Plain.PDF_${VERSION}_android.apk" aligned.apk
          # Shows the key's public fingerprint (safe to share), to confirm which key signed the app.
          "$TOOLS/apksigner" verify --print-certs "Plain.PDF_${VERSION}_android.apk" | grep -i "SHA-256"
          rm release.jks
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: Plain PDF v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: Plain.PDF_${{ env.VERSION }}_android.apk
          overwrite_files: true
